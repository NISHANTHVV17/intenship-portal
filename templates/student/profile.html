{% extends 'base.html' %}{% block content %}<div class='container py-4'><div class=card><h2>Student Profile</h2><form method=post class='row g-3'><div class=col-md-6><label>Name</label><input class=form-control name=name value='{{student.name}}' required></div><div class=col-md-6><label>Email</label><input class=form-control name=email value='{{student.email}}' required></div><div class=col-md-4><label>Register No</label><input class=form-control name=register_no value='{{student.register_no}}' required></div><div class=col-md-4><label>Department</label><input class=form-control name=department value='{{student.department or ""}}'></div><div class=col-md-4><label>Year</label><input class=form-control name=year type=number value='{{student.year or ""}}'></div><div class=col-md-4><label>CGPA</label><input class=form-control name=cgpa type=number step=.01 value='{{student.cgpa or ""}}'></div><div class=col-md-4><label>Phone</label><input class=form-control name=phone value='{{student.phone or ""}}'></div><div class=col-md-4><label>Gender</label><input class=form-control name=gender value='{{student.gender or ""}}'></div><div class=col-md-4><label>Date of Birth</label><input class=form-control name=date_of_birth type=date value='{{student.date_of_birth or ""}}'></div><div class=col-12><label>Address</label><textarea class=form-control name=address>{{student.address or ''}}</textarea></div><button class='btn btn-primary'>Save Profile</button></form></div></div>{% endblock %}
