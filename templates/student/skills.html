{% extends 'base.html' %}{% block content %}<div class='container py-4'><div class='row g-3'><div class=col-md-5><div class=card><h3>Add Skill</h3><form method=post><select class=form-select name=skill_id>{% for s in skills %}<option value={{s.id}}>{{s.skill_name}}</option>{% endfor %}</select><button class='btn btn-primary mt-2'>Add</button></form></div></div><div class=col-md-7><div class=card><h3>My Skills</h3>{% for s in my_skills %}<div class=skill>{{s.skill_name}}<form method=post action='/student/skills/delete/{{s.id}}'><button class='btn btn-sm btn-outline-danger'>Remove</button></form></div>{% else %}<p>No skills yet.</p>{% endfor %}</div></div></div></div>{% endblock %}
