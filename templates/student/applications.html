{% extends 'base.html' %}{% block content %}<div class='container py-4'><h1>My Applications</h1><div class=card><table class='table'><tr><th>Job</th><th>Company</th><th>Location</th><th>Status</th></tr>{% for a in applications %}<tr><td>{{a.job_title}}</td><td>{{a.company_name}}</td><td>{{a.location or '-'}}</td><td><span class='status'>{{a.status}}</span></td></tr>{% else %}<tr><td colspan=4>No applications.</td></tr>{% endfor %}</table></div></div>{% endblock %}
