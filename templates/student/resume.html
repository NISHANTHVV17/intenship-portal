{% extends 'base.html' %}{% block content %}<div class='container py-4'><div class='card col-lg-7'><h2>Resume</h2><form method=post enctype=multipart/form-data><input class=form-control type=file name=resume accept='.pdf,.doc,.docx' required><button class='btn btn-primary mt-3'>Upload</button></form>{% if student.resume %}<p class='mt-3'>✓ <a href='/resume/{{student.resume}}' target=_blank>View current resume</a></p>{% endif %}</div></div>{% endblock %}
