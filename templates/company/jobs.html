{% extends 'base.html' %}{% block content %}<div class=container><h1 class=mt-4>My Jobs</h1><a class='btn btn-primary mb-3' href='/company/jobs/add'>+ Post Job</a><div class=card><table class='table'><tr><th>Job</th><th>Eligibility</th><th>Applicants</th><th>Status</th><th></th></tr>{% for j in jobs %}<tr><td>{{j.job_title}}</td><td>{{j.eligible_department}} / {{j.eligible_year or 'All'}} / CGPA {{j.min_cgpa}}</td><td>{{j.applicants}}</td><td>{{j.status}}</td><td><form method=post action='/company/jobs/{{j.id}}/toggle'><button class='btn btn-sm btn-outline-primary'>Toggle</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
