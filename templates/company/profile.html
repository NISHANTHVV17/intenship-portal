{% extends 'base.html' %}{% block content %}<div class='container py-4'><div class=card><h2>Company Profile</h2><form method=post class='row g-3'><div class=col-md-6><label>Company Name</label><input class=form-control name=company_name value='{{company.company_name}}'></div><div class=col-md-6><label>Email</label><input class=form-control value='{{company.email}}' disabled></div><div class=col-md-6><label>Phone</label><input class=form-control name=phone value='{{company.phone or ""}}'></div><div class=col-md-6><label>Website</label><input class=form-control name=website value='{{company.website or ""}}'></div><div class=col-12><label>Address</label><textarea class=form-control name=address>{{company.address or ''}}</textarea></div><button class='btn btn-primary'>Save</button></form></div></div>{% endblock %}
