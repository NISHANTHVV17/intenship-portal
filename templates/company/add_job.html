{% extends 'base.html' %}{% block content %}<div class='container py-4'><div class=card><h2>Post New Job</h2><form method=post class='row g-3'><div class=col-md-8><label>Job Title</label><input class=form-control name=job_title required></div><div class=col-md-4><label>Salary</label><input class=form-control name=salary></div><div class=col-md-6><label>Location</label><input class=form-control name=location></div><div class=col-md-6><label>Minimum CGPA</label><input class=form-control type=number step=.01 name=min_cgpa value=0></div><div class=col-md-6><label>Eligible Department</label><input class=form-control name=eligible_department value=All></div><div class=col-md-3><label>Eligible Year</label><select class=form-select name=eligible_year><option value=0>All</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class=col-md-3><label>Deadline</label><input class=form-control type=date name=deadline></div><div class=col-12><label>Description</label><textarea class=form-control name=description rows=5></textarea></div><button class='btn btn-primary'>Publish Job</button></form></div></div>{% endblock %}
