<!doctype html>
<html>
    <head>
        <meta charset=utf-8>
        <meta name=viewport content='width=device-width,initial-scale=1'>
        <title>{% block title %}PlacementHub{% endblock %}</title>
        <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel=stylesheet>
        <link href='{{ url_for("static",filename="css/style.css") }}' rel=stylesheet></head>
        <body>
            <nav class='navbar navbar-dark bg-dark'>
            <div class=container><a class='navbar-brand fw-bold' href='/'>Placement<span>Hub</span></a><div>{% if session.get('user_id') %}<a class='btn btn-sm btn-light me-2' href='/dashboard'>Dashboard</a><a class='btn btn-sm btn-outline-light' href='/logout'>Logout</a>{% else %}<a class='btn btn-sm btn-outline-light me-2' href='/login'>Login</a><a class='btn btn-sm btn-light' href='/register'>Register</a>{% endif %}</div></div></nav>{% with m=get_flashed_messages(with_categories=true) %}<div class='container pt-3'>{% for c,x in m %}<div class='alert alert-{{c}}'>{{x}}</div>{% endfor %}</div>{% endwith %}{% block content %}{% endblock %}</body></html>
